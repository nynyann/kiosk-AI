<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kiosk hướng dẫn thủ tục hành chính</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f1d1a;
    --ink-soft:#5b564c;
    --paper:#f7f1e3;
    --paper-raised:#fffdf7;
    --line:#e2d8c0;
    --indigo:#1f3a5f;
    --indigo-dark:#152a45;
    --indigo-soft:#e6ecf5;
    --ochre:#c9922e;
    --ochre-dark:#9a6c17;
    --ochre-soft:#fbf1dc;
    --brick:#a73f2e;
    --brick-dark:#87301f;
    --brick-soft:#f8e4df;
    --green:#3e6b4f;
    --green-soft:#e2eee5;
    --r-lg:26px;
    --r-md:16px;
    --fs-title: clamp(1.35rem, 3.2vw, 1.9rem);
    --fs-body: clamp(1.12rem, 2.4vw, 1.45rem);
    --fs-label: clamp(0.95rem, 1.8vw, 1.08rem);
    --fs-button: clamp(1.12rem, 2.5vw, 1.4rem);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Be Vietnam Pro', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible{ outline:4px solid var(--ochre); outline-offset:3px; }
  #app{ height:100vh; display:flex; flex-direction:column; }

  /* ---------- thanh trên ---------- */
  #topbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding: clamp(10px,1.8vh,16px) clamp(14px,3vw,28px);
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
  }
  #topbar .dot{ width:11px; height:11px; border-radius:50%; background:#9a9483; flex-shrink:0; transition:background .3s; }
  #topbar .dot.ok{ background:var(--green); }
  #topbar .dot.bad{ background:var(--brick); }
  #topbar .dot.warn{ background:var(--ochre); }
  #brand{ font-weight:800; color:var(--indigo); font-size:var(--fs-label); user-select:none; }
  #statusText{ color:var(--ink-soft); font-size:var(--fs-label); }
  #homeBtn{
    margin-left:auto;
    border:2px solid var(--line); background:#fff; color:var(--ink-soft);
    font-weight:600; font-size:var(--fs-label); padding:8px 16px; border-radius:999px;
  }
  #stepper{ display:flex; gap:8px; width:100%; }
  .step-pill{
    flex:1; display:flex; align-items:center; gap:10px; min-width:0;
    background:#fff; border:2px solid var(--line); border-radius:999px;
    padding:7px 12px; font-size:var(--fs-label); color:var(--ink-soft);
  }
  .step-pill .n{ flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-weight:800; }
  .step-pill .t{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .step-pill.active{ border-color:var(--indigo); color:var(--indigo); }
  .step-pill.active .n{ background:var(--indigo); color:#fff; }
  .step-pill.done{ border-color:var(--green); color:var(--green); }
  .step-pill.done .n{ background:var(--green); color:#fff; }
  .step-pill.failed{ border-color:var(--brick); color:var(--brick-dark); }
  .step-pill.failed .n{ background:var(--brick); color:#fff; }
  @media (max-width:560px){ .step-pill .t{ display:none; } .step-pill{ justify-content:center; } }

  /* ---------- khung hội thoại ---------- */
  #chat{
    flex:1; min-height:0; overflow-y:auto;
    padding: clamp(14px,2.5vh,24px) clamp(14px,4vw,40px);
    position:relative;
  }
  #chatInner{ max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .msg{ display:flex; gap:12px; align-items:flex-end; animation: rise .25s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }
  .msg.kiosk{ justify-content:flex-start; }
  .msg.user{ justify-content:flex-end; }
  .avatar{
    flex-shrink:0; width:44px; height:44px; border-radius:50%;
    background:var(--indigo); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .avatar svg{ width:24px; height:24px; }
  .bubble{
    max-width: min(88%, 680px);
    padding: 14px 18px;
    border-radius: var(--r-lg);
    font-size: var(--fs-body); line-height:1.5;
    text-align:left;
  }
  .msg.kiosk .bubble{ background:var(--paper-raised); border:1px solid var(--line); border-bottom-left-radius:8px; }
  .msg.user .bubble{ background:var(--indigo); color:#fff; border-bottom-right-radius:8px; font-weight:600; }
  .bubble p{ margin:0 0 8px; }
  .bubble p:last-child{ margin-bottom:0; }
  .bubble .hint{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size: var(--fs-label); color: var(--ink-soft); line-height:1.45;
    display:flex; gap:8px; align-items:flex-start;
  }
  .bubble .hint svg{ width:1.2em; height:1.2em; flex-shrink:0; margin-top:.15em; color:var(--ochre-dark); }
  .bubble .stephead{
    display:inline-flex; align-items:center; gap:8px;
    font-size: var(--fs-label); font-weight:800; letter-spacing:.3px;
    color:var(--indigo); background:var(--indigo-soft);
    padding:5px 12px; border-radius:999px; margin-bottom:10px;
  }
  .bubble .stephead.bad{ color:var(--brick-dark); background:var(--brick-soft); }
  .bubble .stephead.warn{ color:var(--ochre-dark); background:var(--ochre-soft); }
  .bubble .stephead.ok{ color:var(--green); background:var(--green-soft); }
  .bubble .qtext{ font-size: var(--fs-title); font-weight:800; line-height:1.3; margin:0; }
  .bubble b.proc{ color:var(--indigo); font-weight:800; }
  .typing{ display:inline-flex; gap:6px; padding:6px 2px; }
  .typing i{ width:10px; height:10px; border-radius:50%; background:var(--ink-soft); opacity:.4; animation: blink 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.2s; } .typing i:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  /* thẻ nội dung trong bong bóng (bước 2, 3) */
  .card{ background:#fff; border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; margin-top:10px; }
  .card h3{ margin:0 0 8px; font-size:var(--fs-label); text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); }
  .checklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .checklist li{ display:flex; gap:10px; align-items:flex-start; font-size:var(--fs-body); line-height:1.4; }
  .checklist li .box{ flex-shrink:0; width:26px; height:26px; border-radius:7px; border:2px solid var(--indigo); color:var(--indigo); display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .checklist li .box svg{ width:16px; height:16px; }
  .checklist.notes li{ font-size:var(--fs-label); }
  .checklist.notes li .box{ border-color:var(--ochre-dark); color:var(--ochre-dark); background:var(--ochre-soft); }
  .bullets{ margin:0; padding-left:1.25em; font-size:var(--fs-label); line-height:1.5; }
  .bullets li{ margin-bottom:5px; }
  .meta{ display:flex; gap:10px; font-size:var(--fs-label); line-height:1.45; margin-bottom:6px; }
  .meta .k{ flex-shrink:0; width:8.5em; color:var(--ink-soft); }
  .meta .v{ font-weight:600; }
  .source{ display:inline-block; margin-top:6px; font-size:var(--fs-label); color:var(--ochre-dark); text-decoration:underline; }
  .chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .chip{
    border:2px solid var(--indigo); background:#fff; color:var(--indigo);
    border-radius:14px; padding:12px 16px; font-weight:700; font-size:var(--fs-label); text-align:left; line-height:1.3;
  }
  .chip:active{ background:var(--indigo); color:#fff; }

  /* ---------- khung trả lời (dưới cùng) ---------- */
  #composer{
    flex-shrink:0;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    padding: clamp(12px,2vh,20px) clamp(14px,4vw,40px) calc(clamp(12px,2vh,20px) + env(safe-area-inset-bottom));
  }
  #composerInner{ max-width:860px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .lead{ font-size:var(--fs-label); color:var(--ink-soft); text-align:center; margin:0; max-width:52ch; line-height:1.45; }
  .options{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:10px; width:100%; }
  .opt-btn{
    border:2px solid var(--indigo); background:#fff; color:var(--indigo);
    border-radius:var(--r-md); padding:16px 18px; min-height:68px;
    font-weight:700; font-size:var(--fs-body); line-height:1.3; text-align:center;
  }
  .opt-btn:active{ background:var(--indigo); color:#fff; }
  .row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; }
  .mic-big{
    width: min(34vw, 132px); height: min(34vw, 132px); border-radius:50%; border:none;
    background: radial-gradient(circle at 35% 30%, #2c4a72, var(--indigo) 70%);
    color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 28px rgba(31,58,95,.28);
  }
  .mic-big svg{ width:46%; height:46%; }
  .mic-big:active{ filter:brightness(.92); }
  .mic-big.rec{
    background: radial-gradient(circle at 35% 30%, #c85142, var(--brick) 70%);
    animation:pulse 1.5s ease-in-out infinite;
    transform: scale(var(--level, 1));
    box-shadow:none;
  }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(167,63,46,.35);} 50%{ box-shadow:0 0 0 22px rgba(167,63,46,0);} }
  .timer{ font-variant-numeric:tabular-nums; font-size:var(--fs-title); font-weight:800; color:var(--brick); }
  .btn{
    border:none; border-radius:999px; padding:16px 30px;
    font-weight:700; font-size:var(--fs-button);
    display:inline-flex; align-items:center; gap:10px;
  }
  .btn svg{ width:1.15em; height:1.15em; flex-shrink:0; }
  .btn.primary{ background:var(--indigo); color:#fff; }
  .btn.primary:active{ background:var(--indigo-dark); }
  .btn.green{ background:var(--green); color:#fff; }
  .btn.danger{ background:var(--brick); color:#fff; }
  .btn.outline{ background:#fff; color:var(--indigo); border:2px solid var(--indigo); }
  .btn.outline:active{ background:var(--indigo-soft); }
  .btn.link{ background:transparent; color:var(--ink-soft); text-decoration:underline; font-size:var(--fs-label); padding:8px 14px; font-weight:600; }

  /* ---------- bảng gỡ lỗi ---------- */
  #debug{
    position:fixed; inset:auto 12px 12px 12px; max-width:480px; margin:0 auto;
    background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px;
    font-size:13px; color:var(--ink-soft); box-shadow:0 8px 30px rgba(0,0,0,.18); display:none; z-index:50;
  }
  #debug.open{ display:block; }
  #debug h3{ margin:0 0 8px; font-size:14px; color:var(--ink); }
  #debug label{ display:block; margin:8px 0 4px; }
  #debug input{ width:100%; padding:8px 10px; font-family:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; }
  #debug .drow{ display:flex; gap:8px; margin-top:10px; }
  #debug button{ font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--indigo); background:var(--indigo); color:#fff; }
  #debug button.ghost{ background:transparent; color:var(--indigo); }
  #debug pre{ white-space:pre-wrap; max-height:140px; overflow:auto; background:var(--paper); padding:8px; border-radius:8px; margin-top:8px; }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <span class="dot" id="statusDot"></span>
    <span id="brand" ontouchstart="handleBrandTap()" onclick="handleBrandTap()">Kiosk thủ tục</span>
    <span id="statusText">Đang kết nối…</span>
    <button id="homeBtn" hidden>✕ Về đầu</button>
    <div id="stepper" hidden>
      <div class="step-pill" data-step="1"><span class="n">1</span><span class="t">Kiểm tra điều kiện</span></div>
      <div class="step-pill" data-step="2"><span class="n">2</span><span class="t">Chuẩn bị hồ sơ</span></div>
      <div class="step-pill" data-step="3"><span class="n">3</span><span class="t">Nộp hồ sơ</span></div>
    </div>
  </header>

  <main id="chat"><div id="chatInner"></div></main>

  <footer id="composer"><div id="composerInner"></div></footer>
</div>

<div id="debug">
  <h3>Bảng gỡ lỗi (chỉ dành cho Kns)</h3>
  <label for="baseInput">Địa chỉ máy chủ (BASE)</label>
  <input id="baseInput" type="text">
  <div class="drow">
    <button id="saveBaseBtn">Lưu &amp; tải lại</button>
    <button class="ghost" id="checkHealthBtn">Gọi /health</button>
    <button class="ghost" id="closeDebugBtn">Đóng</button>
  </div>
  <pre id="debugOut"></pre>
</div>

<script>
/* =====================================================================
   Giao diện kiosk dạng HỘI THOẠI, đi từng bước theo sơ đồ:
     chào → bác cần gì → xác nhận thủ tục → Bước 1 hỏi từng điều kiện
     → Bước 2 chuẩn bị hồ sơ → Bước 3 nộp hồ sơ → kết thúc.
   Mọi câu máy hỏi là một bong bóng bên trái; bác trả lời (bấm hoặc nói)
   là bong bóng bên phải. Khung dưới cùng chỉ hiện đúng thứ bác cần làm
   lúc đó. Giao kèo: API_CONTRACT.md 2.0.
   ===================================================================== */
const DEFAULT_BASE = location.protocol === "file:" ? "http://localhost:8000" : "";
const qsBase = new URLSearchParams(location.search).get("base");
if (qsBase) localStorage.setItem("kiosk_base", qsBase);
let BASE = localStorage.getItem("kiosk_base") || DEFAULT_BASE;

const MAX_RECORD_SECONDS = 58;
const HEALTH_POLL_MS = 4000;
const HEALTH_MAX_WAIT_MS = 90000;
const INACTIVITY_RESET_MS = 120000;   // không ai chạm gì → chào bác mới
const DONE_AUTO_HOME_MS = 15000;

const GREETING_1 = "Xin chào bác! Cháu là máy hướng dẫn làm thủ tục hành chính.";
const GREETING_2 = "Bác cần làm gì ạ?";
const GREETING_HINT = "Bác bấm vào nút micro bên dưới rồi nói, ví dụ: «Tôi 76 tuổi, không có lương hưu thì được hỗ trợ gì?» Nói xong bác bấm «Nói xong rồi».";

const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
const ICON_KIOSK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

/* ---------------------------------------------------------------------
   Tiện ích
   --------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function setStatus(kind, text){
  $("statusDot").className = "dot" + (kind ? " " + kind : "");
  $("statusText").textContent = text;
}
function sessionId(){
  if (!window._sid) window._sid = "kiosk-01-" + Math.floor(Date.now()/1000);
  return window._sid;
}
async function api(path, opts){
  const res = await fetch(BASE + path, opts);
  let data;
  try{ data = await res.json(); } catch(e){ throw new Error("Máy chủ trả về dữ liệu không đọc được."); }
  if (!data.ok){
    console.warn(path, "→", data.code, data.detail);
    throw new Error(data.error || "Có lỗi xảy ra, bác thử lại giúp cháu.");
  }
  return data;
}
const postJson = (path, body) => api(path, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });

let inactivityTimer = null;
function armInactivity(){ clearTimeout(inactivityTimer); inactivityTimer = setTimeout(startConversation, INACTIVITY_RESET_MS); }
["click", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, armInactivity, { passive:true }));

/* ---------------------------------------------------------------------
   Đọc thành tiếng: POST /tts (mp3 giọng Việt), hỏng thì giọng trình duyệt
   --------------------------------------------------------------------- */
let serverTtsReady = false, viVoice = null, lastSpeech = "", currentAudio = null, speechTicket = 0;
function loadVoices(){
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  viVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("vi")) || null;
}
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

async function speak(text){
  if (!text) return;
  lastSpeech = text;
  const ticket = ++speechTicket;
  stopSpeaking();
  if (serverTtsReady){
    try{
      const res = await fetch(BASE + "/tts", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ text }) });
      if (!res.ok) throw new Error("tts " + res.status);
      const blob = await res.blob();
      if (ticket !== speechTicket) return;
      const audio = new Audio(URL.createObjectURL(blob));
      currentAudio = audio;
      audio.onended = audio.onerror = () => URL.revokeObjectURL(audio.src);
      await audio.play();
      return;
    } catch(e){
      console.warn("máy chủ không đọc được, dùng giọng trình duyệt:", e);
      if (ticket !== speechTicket) return;
    }
  }
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN"; if (viVoice) u.voice = viVoice; u.rate = 0.95;
  speechSynthesis.speak(u);
}
function stopSpeaking(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (currentAudio){ currentAudio.pause(); currentAudio = null; }
}

/* ---------------------------------------------------------------------
   Bong bóng hội thoại
   --------------------------------------------------------------------- */
const chat = $("chatInner");
// Cuộn xuống cái mới nhất. Bong bóng dài hơn cả khung (bước 2, 3) thì cuộn
// cho ĐẦU bong bóng lộ ra để bác đọc từ trên xuống, không phải kéo ngược.
function scrollDown(el){
  requestAnimationFrame(() => {
    const box = $("chat");
    // Cuộn tức thì, không mượt: hai lần cuộn mượt nối nhau thì lần sau huỷ
    // lần trước, có lúc màn hình đứng lại giữa chừng.
    if (el && el.offsetHeight > box.clientHeight * 0.7) box.scrollTop = el.offsetTop - 8;
    else box.scrollTop = box.scrollHeight;
  });
}

function kioskSay(html, opts = {}){
  const el = document.createElement("div");
  el.className = "msg kiosk";
  const hint = opts.hint ? `<div class="hint">${ICON_INFO}<span>${esc(opts.hint)}</span></div>` : "";
  el.innerHTML = `<div class="avatar">${ICON_KIOSK}</div><div class="bubble">${html}${hint}</div>`;
  chat.appendChild(el);
  scrollDown(el);
  if (opts.speech) speak(opts.speech);
  return el;
}
function userSay(text){
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chat.appendChild(el);
  scrollDown();
  return el;
}
let typingEl = null;
function showTyping(){
  hideTyping();
  typingEl = document.createElement("div");
  typingEl.className = "msg kiosk";
  typingEl.innerHTML = `<div class="avatar">${ICON_KIOSK}</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
  chat.appendChild(typingEl);
  scrollDown();
}
function hideTyping(){ if (typingEl){ typingEl.remove(); typingEl = null; } }
function clearChat(){ hideTyping(); chat.innerHTML = ""; }

/* ---------------------------------------------------------------------

const NO_VOICE_BTN = btn("noVoiceBtn", "link", "Bác không nói được? Bấm đây để chọn bằng tay");

function composerListen(lead, opts = {}){

/* ---------------------------------------------------------------------
   Trạng thái
   --------------------------------------------------------------------- */
let flowState = null;      // FlowState mới nhất
let answerOrder = [];      // thứ tự câu đã trả lời (cho «Quay lại»)
let pendingProc = null;    // thủ tục vừa nhận ra, chờ bác xác nhận
let procedures = [];       // GET /procedures — chỉ đem ra khi máy không hiểu
let recordContext = "query";
let doneTimer = null;

function updateStepper(){
  const st = flowState;
  const show = st && ["check", "stop", "prepare", "submit", "done"].includes(st.stage);
  $("stepper").hidden = !show;
  $("homeBtn").hidden = !show;
  if (!show) return;
  document.querySelectorAll(".step-pill").forEach(p => {
    const n = Number(p.dataset.step);
    p.classList.remove("active", "done", "failed");
    if (st.stage === "stop"){ if (n === 1) p.classList.add("failed"); }
    else if (st.stage === "done") p.classList.add("done");
    else if (n < st.step) p.classList.add("done");
    else if (n === st.step) p.classList.add("active");
  });
}

/* Bắt đầu cuộc trò chuyện mới: chào → hỏi bác cần gì */
async function startConversation(){
  stopSpeaking();
  clearTimeout(doneTimer);
  flowState = null; answerOrder = []; pendingProc = null; window._sid = null;
  updateStepper();
  clearChat();
  composerWaiting("Bác đợi cháu một chút…");
  kioskSay(`<p>${esc(GREETING_1)}</p>`);
  await wait(650);
  kioskSay(`<p class="qtext">${esc(GREETING_2)}</p>`, { hint: GREETING_HINT, speech: `${GREETING_1} ${GREETING_2} ${GREETING_HINT}` });
  composerListen("Bấm micro rồi nói điều bác cần", { context: "query", extra: NO_VOICE_BTN });
  armInactivity();
}

/* Chỉ khi bác không nói được hoặc máy không hiểu mới đưa danh sách ra */
async function offerProcedureList(){
  if (!procedures.length){
    try{ procedures = (await api("/procedures")).procedures || []; } catch(e){ showError(e.message); return; }
  }
  const chips = procedures.map(p => `<button class="chip" data-id="${esc(p.id)}">${esc(p.name)}${p.short ? `<br><span style="font-weight:500;color:var(--ink-soft)">${esc(p.short)}</span>` : ""}</button>`).join("");
  const el = kioskSay(`<p>Bác bấm chọn việc bác cần làm ạ:</p><div class="chips">${chips}</div>`,
    { speech: "Bác bấm chọn việc bác cần làm trên màn hình ạ." });
  el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    const p = procedures.find(x => x.id === c.dataset.id);
    userSay(p ? p.name : c.dataset.id);
    startFlow(c.dataset.id);
  }));
  composerListen("Hoặc bấm micro rồi nói", { context: "query" });
}

  if (healthWaitStart === null) healthWaitStart = Date.now();
  let ready = false;
  try{

  } catch(e){

  composerWaiting("Máy đang khởi động, bác đợi cháu một chút…");

}

/* ---------------------------------------------------------------------
   Ghi âm — dùng chung: hỏi ban đầu / trả lời câu bước 1 / hỏi thêm
   --------------------------------------------------------------------- */
let mediaRecorder = null, mediaStream = null, audioChunks = [];
let recordTimer = null, recordStartedAt = 0, audioCtx = null, analyser = null, rafId = null;

function pickMimeType(){
  for (const c of ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/ogg"]){
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return undefined;
}
async function startRecording(context, lead){
  recordContext = context || "query";
  stopSpeaking();
  // Trình duyệt chỉ mở micro cho HTTPS hoặc đúng chữ "localhost". Mở qua
  // http://192.168.x.x thì navigator.mediaDevices là undefined — không phải
  // bị từ chối quyền, hai lỗi sửa hai cách khác nhau.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    const qua = window.isSecureContext
      ? "Trình duyệt này không hỗ trợ thu âm."
      : "Trang đang mở bằng http nên trình duyệt khoá micro. Mở lại bằng https, hoặc mở ngay trên máy chạy máy chủ với địa chỉ localhost.";
    showError("Máy chưa dùng được micro. " + qua);
    return;
  }
  try{ mediaStream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){
    const thieuMic = e && (e.name === "NotFoundError" || e.name === "DevicesNotFoundError");
    showError(thieuMic ? "Máy này chưa có micro nào để cháu nghe ạ."
                       : "Cháu chưa xin được quyền dùng micro. Bác nhờ cán bộ bật quyền micro cho trình duyệt giúp cháu.");
    return;
  }
  audioChunks = [];
  const mimeType = pickMimeType();
  try{ mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream); }
  catch(e){ mediaRecorder = new MediaRecorder(mediaStream); }
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStopped;
  mediaRecorder.start();
  recordStartedAt = Date.now();
  composerRecording(lead || "Cháu đang nghe, bác cứ nói tự nhiên. Nói xong bác bấm nút đỏ.");
  recordTimer = setInterval(updateTimer, 200);
  setupLevelMeter(mediaStream);
}
function updateTimer(){
  const elapsed = (Date.now() - recordStartedAt) / 1000;
  const t = $("timerText");
  if (t) t.textContent = `${String(Math.floor(elapsed/60)).padStart(2,"0")}:${String(Math.floor(elapsed%60)).padStart(2,"0")}`;
  if (elapsed >= MAX_RECORD_SECONDS) stopRecording();
}
function setupLevelMeter(stream){
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const tick = () => {
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0) / data.length;
      const ring = $("recRing");
      if (ring) ring.style.setProperty("--level", (1 + Math.min(avg/130, 0.18)).toFixed(3));
      rafId = requestAnimationFrame(tick);
    };
    tick();
  } catch(e){}
}
function teardownLevelMeter(){
  if (rafId) cancelAnimationFrame(rafId); rafId = null;
  if (audioCtx){ audioCtx.close().catch(()=>{}); audioCtx = null; }
  analyser = null;
}
function stopRecording(){
  clearInterval(recordTimer);
  teardownLevelMeter();
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
}
function onRecordingStopped(){
  const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
  if (recordContext === "answer") sendVoiceAnswer(blob);
  else if (recordContext === "ask") sendAsk(blob);
  else sendTurn(blob);
}

/* ---------------------------------------------------------------------
   «Bác cần làm gì?» → nhận ra thủ tục → xác nhận
   --------------------------------------------------------------------- */
function askAgain(text){
  kioskSay(`<p class="qtext">${esc(text)}</p>`, { hint: GREETING_HINT, speech: text });
  composerListen("Bấm micro rồi nói lại", { context:"query", extra: NO_VOICE_BTN });
}

async function sendTurn(blob){
  composerWaiting("Cháu đang nghe…");
  showTyping();
  const fd = new FormData();
  fd.append("audio", blob, "cauhoi.webm");
  fd.append("session_id", sessionId());
  let data;
  try{ data = await api("/turn", { method:"POST", body: fd }); }
  catch(e){ hideTyping(); showError(e.message); return; }
  hideTyping();
  const asr = data.asr || {}, answer = data.answer || {};

  if (asr.no_speech || !asr.text){
    kioskSay(`<p>${esc(answer.answer || "Cháu chưa nghe rõ ạ. Bác nói lại giúp cháu một lần nữa.")}</p>`,
      { hint: "Bác nói to, rõ, gần micro. Nói xong bấm «Nói xong rồi».", speech: answer.speech || answer.answer });
    composerListen("Bấm micro rồi nói lại", { context:"query", extra: NO_VOICE_BTN });
    return;
  }
  userSay(asr.text);
  if (answer.handoff || !answer.procedure_id){
    kioskSay(`<p>${esc(answer.answer || "Cháu chưa hiểu bác cần gì.")}</p>`, { speech: answer.speech || answer.answer });
    await offerProcedureList();
    return;
  }
  pendingProc = { id: answer.procedure_id, name: answer.procedure_name };
  kioskSay(`<p>Cháu hiểu bác cần làm thủ tục <b class="proc">${esc(answer.procedure_name)}</b>. Đúng không ạ?</p>`,
    { hint: "Bác bấm «Đúng rồi» để cháu hướng dẫn từng bước, hoặc «Không phải» để nói lại.",
      speech: answer.confirm || `Cháu hiểu bác cần làm thủ tục ${answer.procedure_name}. Đúng không ạ?` });
  setComposer(`<div class="row">${btn("yesBtn", "primary", "Đúng rồi, hướng dẫn cháu nhé", ICON_CHECK)}${btn("noBtn", "outline", "Không phải, tôi nói lại")}</div>`);
  $("yesBtn").addEventListener("click", () => { userSay("Đúng rồi"); startFlow(pendingProc.id); });
  $("noBtn").addEventListener("click", () => { userSay("Không phải"); askAgain("Vậy bác nói lại giúp cháu, bác cần làm gì ạ?"); });
}

/* ---------------------------------------------------------------------
   Luồng 3 bước
   --------------------------------------------------------------------- */
async function startFlow(procedureId){
  stopSpeaking();
  composerWaiting("Cháu đang chuẩn bị…");
  showTyping();
  answerOrder = [];
  try{
    const st = await postJson("/flow/start", { procedure_id: procedureId, session_id: sessionId() });
    hideTyping();
    applyState(st);
  } catch(e){ hideTyping(); showError(e.message); }
}

function applyState(st, opts = {}){
  flowState = st;
  updateStepper();
  switch (st.stage){
    case "check":   renderQuestion(st, opts); break;
    case "stop":    renderStop(st); break;
    case "prepare": renderPrepare(st); break;
    case "submit":  renderSubmit(st); break;
    case "done":    renderDone(st); break;
    default: showError("Máy chủ trả về trạng thái lạ: " + st.stage);
  }
}

/* --- Bước 1: hỏi từng câu, mỗi câu kèm cách trả lời --- */
function renderQuestion(st, opts){
  const q = st.question || {};
  if (st.intro){
    kioskSay(`<span class="stephead">Bước 1 · Kiểm tra điều kiện</span><p>${esc(st.intro)}</p>`);
  }
  if (st.matched === false && st.message){
    kioskSay(`<p>${st.asr && st.asr.text ? `Cháu nghe là: «${esc(st.asr.text)}». ` : ""}${esc(st.message)}</p>`);
  } else {
    kioskSay(`<p class="qtext">${esc(q.text)}</p>`, { hint: q.hint });
  }
  if (!opts.silent) speak(st.speech);

  const options = (q.options || []).map(o => `<button class="opt-btn" data-v="${esc(o.value)}">${esc(o.label)}</button>`).join("");
  setComposer(`
    <p class="lead">Câu ${q.index || 1}/${q.total || 1} · Bác bấm chọn một ô, hoặc bấm micro rồi nói</p>
    <div class="options">${options}</div>
    <div class="row">
      ${btn("qVoiceBtn", "outline", "Trả lời bằng lời", ICON_MIC)}
      ${btn("qReplayBtn", "outline", "🔊 Nghe lại")}
      ${answerOrder.length ? btn("qBackBtn", "link", "← Quay lại câu trước") : ""}
    </div>`);
  composer.querySelectorAll(".opt-btn").forEach(b => b.addEventListener("click", () => chooseOption(q, b.dataset.v, b.textContent)));
  $("qVoiceBtn").addEventListener("click", () => startRecording("answer", `Bác trả lời câu: «${q.text}»`));
  $("qReplayBtn").addEventListener("click", () => speak(lastSpeech));
  if ($("qBackBtn")) $("qBackBtn").addEventListener("click", goBackOneQuestion);
}

async function chooseOption(q, value, label){
  if (!flowState) return;
  stopSpeaking();
  userSay(label);
  composerWaiting("…");
  try{
    const st = await postJson("/flow/answer", { procedure_id: flowState.procedure_id, answers: { ...(flowState.answers || {}) },
                                                question_id: q.id, value, session_id: sessionId() });
    answerOrder.push(q.id);
    applyState(st);
  } catch(e){ showError(e.message); }
}

async function sendVoiceAnswer(blob){
  if (!flowState || !flowState.question) return startConversation();
  composerWaiting("Cháu đang nghe câu trả lời…");
  showTyping();
  const fd = new FormData();
  fd.append("audio", blob, "traloi.webm");
  fd.append("procedure_id", flowState.procedure_id);
  fd.append("question_id", flowState.question.id);
  fd.append("answers", JSON.stringify(flowState.answers || {}));
  fd.append("session_id", sessionId());
  const qid = flowState.question.id;
  try{
    const st = await api("/flow/answer-voice", { method:"POST", body: fd });
    hideTyping();
    if (st.asr && st.asr.text) userSay(st.asr.text);
    if (st.matched) answerOrder.push(qid);
    applyState(st);
  } catch(e){ hideTyping(); showError(e.message); }
}

async function goBackOneQuestion(){
  if (!flowState || !answerOrder.length) return;
  stopSpeaking();
  const answers = { ...(flowState.answers || {}) };
  delete answers[answerOrder.pop()];
  userSay("Quay lại câu trước");
  try{
    const st = await postJson("/flow/next", { procedure_id: flowState.procedure_id, answers, stage:"check", session_id: sessionId() });
    st.intro = null;
    applyState(st, { silent:true });
  } catch(e){ showError(e.message); }
}

/* --- Kết luận không đáp ứng / cần cán bộ / thủ tục khác --- */
function renderStop(st){
  const cls = { ineligible:"bad", consult:"warn", redirect:"warn" }[st.verdict] || "bad";
  kioskSay(`<span class="stephead ${cls}">${esc(st.title || "Chưa đủ điều kiện")}</span><p>${esc(st.reason || st.prompt)}</p>`,
    { speech: st.speech });
  setComposer(`<div class="row">
      ${st.suggest_procedure_id ? btn("suggestBtn", "primary", "Xem thủ tục: " + esc(st.suggest_procedure_name || "")) : ""}
      ${btn("replayBtn", "outline", "🔊 Nghe lại")}
      ${btn("restartBtn", "outline", "↺ Làm lại từ đầu")}
      ${btn("endBtn", "link", "Kết thúc")}
    </div>`);
  if ($("suggestBtn")) $("suggestBtn").addEventListener("click", () => { userSay("Xem thủ tục " + st.suggest_procedure_name); startFlow(st.suggest_procedure_id); });
  $("replayBtn").addEventListener("click", () => speak(lastSpeech));
  $("restartBtn").addEventListener("click", () => { userSay("Làm lại từ đầu"); startFlow(st.procedure_id); });
  $("endBtn").addEventListener("click", startConversation);
}

/* --- Bước 2 --- */
const checklist = (items, cls = "", checked = false) =>
  `<ul class="checklist ${cls}">${(items || []).map(t => `<li><span class="box">${checked ? ICON_CHECK : ""}</span><span>${esc(t)}</span></li>`).join("")}</ul>`;
const bullets = (items) => `<ul class="bullets">${(items || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;

function renderPrepare(st){
  kioskSay(`
    <span class="stephead ok">Bước 1 xong</span>
    <p>${esc(st.note || "Bác có thể chuẩn bị hồ sơ.")}</p>`);
  kioskSay(`
    <span class="stephead">Bước 2 · Chuẩn bị hồ sơ</span>
    <p>${esc(st.prompt)}</p>
    <div class="card"><h3>Giấy tờ cần chuẩn bị</h3>${checklist(st.documents)}</div>
    ${(st.notes || []).length ? `<div class="card"><h3>Lưu ý theo trường hợp của bác</h3>${checklist(st.notes, "notes", true)}</div>` : ""}
    ${(st.tips || []).length ? `<div class="card"><h3>Thông tin thêm</h3>${bullets(st.tips)}</div>` : ""}`,
    { hint: "Bác có gì chưa rõ về hồ sơ thì bấm «Hỏi thêm» rồi nói. Chuẩn bị xong bác bấm «Sang bước 3».", speech: st.speech });
  composerStage("prepare");
}

/* --- Bước 3 --- */
function renderSubmit(st){
  const meta = [["Cơ quan xử lý", st.agency], ["Thời hạn", st.processing_time], ["Kết quả", st.result], ["Phí", st.fee]]
    .filter(([,v]) => v).map(([k,v]) => `<div class="meta"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("");
  kioskSay(`
    <span class="stephead">Bước 3 · Nộp hồ sơ</span>
    <p>${esc(st.prompt)}</p>
    <div class="card"><h3>Nộp ở đâu</h3>${bullets(st.places)}<h3 style="margin-top:10px">Cách nộp</h3>${bullets(st.methods)}</div>
    <div class="card"><h3>Khi đi bác mang theo</h3>${checklist(st.bring)}</div>
    ${(st.notes || []).length ? `<div class="card"><h3>Lưu ý theo trường hợp của bác</h3>${checklist(st.notes, "notes", true)}</div>` : ""}
    <div class="card"><h3>Quá trình xử lý và thời hạn</h3>${meta}
      ${st.source && st.source.title ? `<a class="source" href="${esc(st.source.url || "#")}" target="_blank" rel="noopener">Nguồn: ${esc(st.source.title)}</a>` : ""}
    </div>`,
    { hint: "Bác còn thắc mắc thì bấm «Hỏi thêm» rồi nói. Đã rõ thì bấm «Kết thúc».", speech: st.speech });
  composerStage("submit");
}

function composerStage(stage){
  const next = stage === "prepare" ? btn("nextBtn", "primary", "Đã rõ, sang bước 3 →") : btn("nextBtn", "green", "Đã rõ, kết thúc", ICON_CHECK);
  setComposer(`<div class="row">${btn("askBtn", "outline", "Hỏi thêm", ICON_MIC)}${btn("replayBtn", "outline", "🔊 Nghe lại")}${next}</div>`);
  $("askBtn").addEventListener("click", () => startRecording("ask", stage === "prepare" ? "Bác hỏi gì về hồ sơ, cháu nghe đây." : "Bác hỏi gì về việc nộp hồ sơ, cháu nghe đây."));
  $("replayBtn").addEventListener("click", () => speak(lastSpeech));
  $("nextBtn").addEventListener("click", nextStage);
}

async function nextStage(){
  if (!flowState) return;
  stopSpeaking();
  userSay(flowState.stage === "prepare" ? "Đã rõ, sang bước 3" : "Đã rõ, kết thúc");
  composerWaiting("…");
  try{
    const st = await postJson("/flow/next", { procedure_id: flowState.procedure_id, answers: flowState.answers || {}, stage: flowState.stage, session_id: sessionId() });
    applyState(st);
  } catch(e){ showError(e.message); }
}

/* --- Hỏi thêm ở bước 2 / 3 --- */
async function sendAsk(blob){
  if (!flowState) return startConversation();
  const stage = flowState.stage;
  composerWaiting("Cháu đang tìm trong kho tri thức của thủ tục này…");
  showTyping();
  const fd = new FormData();
  fd.append("audio", blob, "hoithem.webm");
  fd.append("procedure_id", flowState.procedure_id);
  fd.append("session_id", sessionId());
  let d;
  try{ d = await api("/flow/ask", { method:"POST", body: fd }); }
  catch(e){ hideTyping(); showError(e.message); return; }
  hideTyping();
  const heard = d.question || (d.asr && d.asr.text) || "";
  if (heard) userSay(heard);
  const el = kioskSay(`<p>${esc(d.answer)}</p>${d.switch_to ? `<div class="chips"><button class="chip" id="switchBtn">Chuyển sang: ${esc(d.switch_name || d.switch_to)}</button></div>` : ""}`,
    { speech: d.speech || d.answer });
  if (d.switch_to) el.querySelector("#switchBtn").addEventListener("click", () => { userSay("Chuyển sang " + d.switch_name); startFlow(d.switch_to); });
  composerStage(stage);
}

/* --- Kết thúc --- */
function renderDone(st){
  kioskSay(`<span class="stephead ok">Kết thúc</span><p>${esc(st.prompt)}</p>`, { speech: st.speech });
  setComposer(`<div class="row">${btn("homeBtn2", "primary", "Xong, về màn hình chính")}</div>`);
  $("homeBtn2").addEventListener("click", startConversation);
  clearTimeout(doneTimer);
  doneTimer = setTimeout(startConversation, DONE_AUTO_HOME_MS);
}

/* --- Lỗi --- */
function showError(message){
  kioskSay(`<span class="stephead bad">Có lỗi xảy ra</span><p>${esc(message)}</p>`);
  setComposer(`<div class="row">${btn("retryBtn", "primary", "Thử lại")}${btn("homeBtn3", "link", "Về màn hình chính")}</div>`);
  $("retryBtn").addEventListener("click", () => {
    if (flowState) applyState(flowState, { silent:true });
    else askAgain("Bác nói lại giúp cháu, bác cần làm gì ạ?");
  });
  $("homeBtn3").addEventListener("click", startConversation);
}

$("homeBtn").addEventListener("click", startConversation);

// Phím cách: bắt đầu / dừng ghi âm khi thử trên máy tính.
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.target.tagName === "INPUT") return;
  e.preventDefault();
  if ($("stopBtn")) stopRecording();
  else if ($("micBtn")) $("micBtn").click();
  else if ($("qVoiceBtn")) $("qVoiceBtn").click();
  else if ($("askBtn")) $("askBtn").click();
});

/* ---------------------------------------------------------------------
   Bảng gỡ lỗi ẩn — bấm 3 lần vào chữ "Kiosk thủ tục"
   --------------------------------------------------------------------- */
let tapCount = 0, tapTimer = null;
function handleBrandTap(){
  tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(() => tapCount = 0, 600);
  if (tapCount >= 3){ tapCount = 0; $("baseInput").value = BASE || location.origin; $("debug").classList.add("open"); }
}
$("closeDebugBtn").addEventListener("click", () => $("debug").classList.remove("open"));
$("saveBaseBtn").addEventListener("click", () => { localStorage.setItem("kiosk_base", $("baseInput").value.trim()); location.reload(); });
$("checkHealthBtn").addEventListener("click", async () => {
  try{ $("debugOut").textContent = JSON.stringify(await (await fetch(BASE + "/health")).json(), null, 2); }
  catch(e){ $("debugOut").textContent = "Lỗi: " + e.message; }
});
</script>
